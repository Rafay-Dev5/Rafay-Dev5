# Generate static GitHub stats SVGs (no Vercel dependency).
# Runs daily + on manual trigger. First run after push creates profile/*.svg.
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-stats.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&theme=transparent&hide_border=true&bg_color=14213D&title_color=2A9D8F&icon_color=2A9D8F&text_color=EAF0F7&ring_color=2A9D8F
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&theme=transparent&hide_border=true&bg_color=14213D&title_color=2A9D8F&text_color=EAF0F7
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        run: |
          mkdir -p profile
          curl -fsSL -o profile/streak.svg \
            "https://github-readme-streak-stats.herokuapp.com/?user=${{ github.repository_owner }}&theme=dark&background=14213D&ring=2A9D8F&fire=2A9D8F&currStreakLabel=2A9D8F&sideLabels=EAF0F7&dates=A9BBD6&hide_border=true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
